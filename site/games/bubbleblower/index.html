<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Blower · Roshan Adhikari</title>
<meta name="description" content="Hold to blow a bubble, let go when it fills the shape. Pick an undersea buddy and chase a perfect ten. Free, no sign-up.">
<meta name="theme-color" content="#060606">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/assets/arcade-back.css">
<style>
:root {
  color-scheme: dark;
  --bg: #060606;
  --card: #0d0d0d;
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(255, 255, 255, .14);
  --txt: #ece9e0;
  --mute: rgba(236, 233, 224, .58);
  --y: #e8ff47;
  --o: #ff5e1a;
  --sea: #47d7ff;
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --gutter: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--txt);
  font: 400 15px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) var(--gutter) env(safe-area-inset-bottom);
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--y); outline-offset: 3px; }
[hidden] { display: none !important; }

.top, main, footer { width: 100%; max-width: 560px; margin: 0 auto; }
.top { height: 60px; display: flex; align-items: center; justify-content: space-between; flex: none; }
main { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 4px 0 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 60px); line-height: .9; letter-spacing: .02em; text-align: center; }
h1 span { color: var(--sea); }
.sub { color: var(--mute); text-align: center; max-width: 40ch; }

.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 16px; color: var(--mute); }
.icon-btn:hover { color: var(--txt); }

/* ---------- character pick ---------- */
.pick { width: 100%; display: grid; gap: 10px; }
.buddy {
  display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 14px; text-align: left;
  padding: 10px 14px 10px 10px; border-radius: 18px; border: 1px solid var(--line2); background: var(--card);
  transition: border-color .2s, transform .1s, background .2s;
}
.buddy:hover { border-color: rgba(71, 215, 255, .5); }
.buddy:active { transform: scale(.985); }
.buddy[aria-pressed="true"] { border-color: var(--sea); background: #0b1a20; }
.buddy .face { width: 84px; height: 84px; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #12394a, #071820); display: grid; place-items: center; }
.buddy .face img { width: 76px; height: 76px; }
.buddy h3 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; letter-spacing: .03em; }
.buddy .perk { font-size: 13px; color: var(--sea); font-weight: 600; margin: 2px 0; }
.buddy p { font-size: 13px; color: var(--mute); line-height: 1.4; }
.buddy .best { font-size: 12px; color: var(--mute); margin-top: 4px; }
.buddy .best b { color: var(--y); font-weight: 600; }

.btn { min-height: 46px; padding: 0 24px; border-radius: 999px; font-size: 15px; font-weight: 600; border: 1px solid var(--line2); white-space: nowrap; transition: border-color .2s, background .2s, transform .1s; }
.btn:hover { border-color: rgba(255, 255, 255, .3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--y); color: var(--bg); border-color: var(--y); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- play ---------- */
.hud { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
.hud > div { display: grid; gap: 0; }
.hud .r { text-align: right; }
.hud small { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
.hud b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.hud .mid { text-align: center; }
.hud .mid b { color: var(--sea); font-size: 26px; }
.stage { position: relative; width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid var(--line2); }
canvas { display: block; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
.hint { font-size: 12.5px; color: var(--mute); text-align: center; min-height: 1.5em; }
.pips { display: flex; gap: 6px; justify-content: center; }
.pips i { width: 10px; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .1); }

/* ---------- end ---------- */
.end { width: 100%; display: grid; justify-items: center; gap: 14px; text-align: center; }
.end .big { font-family: var(--display); font-size: 84px; line-height: .9; color: var(--y); }
.end .who { display: flex; align-items: center; gap: 10px; color: var(--mute); }
.end .who img { width: 56px; height: 56px; }
.tally { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tally div { border-radius: 12px; background: var(--card); border: 1px solid var(--line); padding: 8px 4px; display: grid; gap: 2px; }
.tally small { font-size: 10.5px; color: var(--mute); }
.tally b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1; }
.newbest { color: var(--y); font-weight: 600; }

footer { border-top: 1px solid var(--line); padding: 16px 0 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--mute); flex: none; }
footer a:hover { color: var(--txt); }
</style>
</head>
<body>
<header class="top">
  <a class="ra-back" href="/games#games"><span class="ra-mark" aria-hidden="true">RA</span><span><span class="ra-arrow" aria-hidden="true">←</span> All games</span></a>
  <button class="icon-btn" id="mute" type="button" aria-label="Sound on" aria-pressed="false">♪</button>
</header>

<main>
  <h1>Bubble <span>Blower</span></h1>

  <!-- pick a buddy -->
  <section id="pickScreen" class="pick-wrap" style="width:100%;display:grid;gap:14px;justify-items:center">
    <p class="sub">Hold to blow. Let go when your bubble fills the dotted shape. Blow too far and it pops. Ten bubbles a game.</p>
    <div class="pick" id="pick" role="group" aria-label="Choose your buddy"></div>
    <button class="btn primary" id="start" type="button">Start blowing</button>
  </section>

  <!-- play -->
  <section id="playScreen" style="width:100%;display:grid;gap:10px" hidden>
    <div class="hud">
      <div><small>Score</small><b id="score">0</b></div>
      <div class="mid"><small>Shape</small><b id="shape">Round</b></div>
      <div class="r"><small>Bubble</small><b id="round">1/10</b></div>
    </div>
    <div class="stage"><canvas id="cv" aria-label="Bubble stage. Hold to blow, release to let the bubble go."></canvas></div>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <p class="hint" id="hint">Hold anywhere on the water (or Space) to blow</p>
  </section>

  <!-- end -->
  <section id="endScreen" class="end" hidden>
    <div class="who"><img id="endFace" alt=""><span id="endName"></span></div>
    <div class="big" id="endScore">0</div>
    <p id="endNote" class="sub"></p>
    <div class="tally" id="tally"></div>
    <div class="row">
      <button class="btn primary" id="again" type="button">Blow again</button>
      <button class="btn" id="change" type="button">Change buddy</button>
    </div>
  </section>
</main>

<footer>
  <span>© <span id="yr">2026</span> Roshan Adhikari</span>
  <a href="https://www.roshana.name.np/">roshana.name.np</a>
</footer>

<script>
'use strict';
document.getElementById('yr').textContent = new Date().getFullYear();

/* ---------- the buddies (original characters, drawn here as SVG) ----------
   speed: how fast the bubble grows. mult: score multiplier. A faster blower is harder to stop on time, so it pays more. */
function spikes(cx, cy, r, n, len, fill) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, w = 0.16;
    const p = (ang, rr) => `${(cx + Math.cos(ang) * rr).toFixed(1)},${(cy + Math.sin(ang) * rr).toFixed(1)}`;
    s += `<polygon points="${p(a - w, r - 2)} ${p(a, r + len)} ${p(a + w, r - 2)}" fill="${fill}"/>`;
  }
  return s;
}
const BUDDIES = [
  {
    id: 'puff', name: 'Puff', perk: 'Big lungs: blows 30% faster, scores ×1.3',
    blurb: 'A pufferfish who inflates when excited, which is always.',
    speed: 1.3, mult: 1.3,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <ellipse cx="60" cy="112" rx="30" ry="5" fill="rgba(0,0,0,.25)"/>
      <path d="M96 64 L114 50 L112 78 Z" fill="#ffb347" stroke="#c46a1a" stroke-width="2" stroke-linejoin="round"/>
      ${spikes(56, 64, 38, 18, 7, '#e8842a')}
      <circle cx="56" cy="64" r="38" fill="#ff9f43" stroke="#c46a1a" stroke-width="2.5"/>
      <ellipse cx="54" cy="80" rx="24" ry="16" fill="#ffd8a0"/>
      <circle cx="42" cy="52" r="11" fill="#fff"/><circle cx="68" cy="52" r="11" fill="#fff"/>
      <circle cx="44" cy="54" r="5.5" fill="#1a1a2e"/><circle cx="66" cy="54" r="5.5" fill="#1a1a2e"/>
      <circle cx="46" cy="51" r="2" fill="#fff"/><circle cx="68" cy="51" r="2" fill="#fff"/>
      <ellipse cx="55" cy="76" rx="6" ry="7" fill="#7a2b10"/><ellipse cx="55" cy="78" rx="3" ry="3" fill="#c0503a"/>
      <circle cx="30" cy="66" r="4" fill="#ff7a7a" opacity=".55"/><circle cx="80" cy="66" r="4" fill="#ff7a7a" opacity=".55"/>
      <ellipse cx="22" cy="78" rx="9" ry="5" fill="#ffb347" stroke="#c46a1a" stroke-width="2" transform="rotate(-25 22 78)"/>
    </svg>`
  },
  {
    id: 'shellby', name: 'Shellby', perk: 'Steady claws: normal speed, scores ×1',
    blurb: 'A hermit crab carrying a borrowed shell and a big opinion.',
    speed: 1, mult: 1,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <ellipse cx="60" cy="112" rx="38" ry="5" fill="rgba(0,0,0,.25)"/>
      <circle cx="76" cy="62" r="34" fill="#6c7cff" stroke="#3a46b8" stroke-width="2.5"/>
      <path d="M76 62 m0 -4 a4 4 0 1 1 -4 4 a9 9 0 1 1 9 9 a15 15 0 1 1 -15 -15 a22 22 0 1 1 22 22" fill="none" stroke="#c7ceff" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#b8352a" stroke-width="3.5" stroke-linecap="round">
        <line x1="34" y1="96" x2="26" y2="110"/><line x1="44" y1="98" x2="40" y2="111"/><line x1="56" y1="98" x2="58" y2="111"/>
      </g>
      <ellipse cx="44" cy="86" rx="26" ry="16" fill="#ff6b5a" stroke="#b8352a" stroke-width="2.5"/>
      <line x1="36" y1="74" x2="30" y2="46" stroke="#b8352a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="48" y1="74" x2="52" y2="46" stroke="#b8352a" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="30" cy="42" r="8" fill="#fff" stroke="#b8352a" stroke-width="2"/><circle cx="52" cy="42" r="8" fill="#fff" stroke="#b8352a" stroke-width="2"/>
      <circle cx="31" cy="43" r="4" fill="#1a1a2e"/><circle cx="51" cy="43" r="4" fill="#1a1a2e"/>
      <path d="M34 90 q8 6 16 0" fill="none" stroke="#7a1f16" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M14 70 a12 12 0 1 1 10 18 l-4 -8 l8 -2 a5 5 0 1 0 -8 -4 z" fill="#ff6b5a" stroke="#b8352a" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>`
  },
  {
    id: 'tide', name: 'Tide', perk: 'Slow and steady: blows 25% slower, scores ×0.8',
    blurb: 'A sea turtle who has never once been in a hurry.',
    speed: 0.75, mult: 0.8,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <ellipse cx="62" cy="112" rx="40" ry="5" fill="rgba(0,0,0,.25)"/>
      <ellipse cx="40" cy="100" rx="12" ry="6" fill="#7fd6a0" stroke="#2c7a52" stroke-width="2" transform="rotate(20 40 100)"/>
      <ellipse cx="92" cy="100" rx="12" ry="6" fill="#7fd6a0" stroke="#2c7a52" stroke-width="2" transform="rotate(-20 92 100)"/>
      <path d="M100 86 l14 4 l-12 6 z" fill="#7fd6a0" stroke="#2c7a52" stroke-width="2" stroke-linejoin="round"/>
      <path d="M28 92 Q30 44 68 42 Q106 44 106 92 Z" fill="#2fbf8a" stroke="#1d7a57" stroke-width="2.5" stroke-linejoin="round"/>
      <g fill="none" stroke="#1d7a57" stroke-width="2"><polygon points="58,54 76,54 82,68 70,80 58,80 52,68"/><path d="M52 68 L38 72 M82 68 L98 72 M58 54 L52 46 M76 54 L84 46 M58 80 L52 92 M70 80 L76 92"/></g>
      <rect x="26" y="88" width="82" height="8" rx="4" fill="#e9d79a" stroke="#1d7a57" stroke-width="2"/>
      <ellipse cx="22" cy="70" rx="16" ry="14" fill="#9be3b5" stroke="#2c7a52" stroke-width="2.5"/>
      <circle cx="16" cy="66" r="5" fill="#fff"/><circle cx="15" cy="67" r="2.6" fill="#1a1a2e"/>
      <path d="M10 76 q6 5 14 1" fill="none" stroke="#2c7a52" stroke-width="2.2" stroke-linecap="round"/>
    </svg>`
  }
];
const svgUrl = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
for (const b of BUDDIES) { b.url = svgUrl(b.svg); b.img = new Image(); b.img.src = b.url; }

/* ---------- shapes, in unit space: centred on 0,0, about ±1 wide. bottom = where the shape meets the wand ring ---------- */
const SHAPES = {
  round: { name: 'Round', bottom: 1, path(c) { c.arc(0, 0, 1, 0, Math.PI * 2); } },
  heart: { name: 'Heart', bottom: 1, path(c) { c.moveTo(0, 1); c.bezierCurveTo(-1.55, -0.05, -0.75, -1.35, 0, -0.55); c.bezierCurveTo(0.75, -1.35, 1.55, -0.05, 0, 1); c.closePath(); } },
  star:  { name: 'Star', bottom: 0.81, path(c) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.46 : 1; i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); } },
  fish:  { name: 'Fish', bottom: 0.62, path(c) { c.moveTo(-1, 0); c.bezierCurveTo(-0.85, -0.75, 0.35, -0.75, 0.55, -0.05); c.lineTo(1, -0.55); c.lineTo(0.92, 0); c.lineTo(1, 0.55); c.lineTo(0.55, 0.05); c.bezierCurveTo(0.35, 0.75, -0.85, 0.75, -1, 0); c.closePath(); } },
  cube:  { name: 'Cube', bottom: 0.9, path(c) { c.roundRect(-0.9, -0.9, 1.8, 1.8, 0.28); } }
};
const SHAPE_KEYS = Object.keys(SHAPES);
const ROUNDS = 10;

/* ---------- storage ---------- */
const STORE = 'bubbleblower.v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { saved = {}; }
saved.best = saved.best || {};
if (!BUDDIES.some(b => b.id === saved.buddy)) saved.buddy = 'puff';
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch {} };

/* ---------- sound (tiny WebAudio blips) ---------- */
let actx = null, muted = !!saved.muted;
const muteBtn = document.getElementById('mute');
function syncMute() { muteBtn.textContent = muted ? '♪̸' : '♪'; muteBtn.setAttribute('aria-pressed', String(muted)); muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); muteBtn.style.opacity = muted ? .5 : 1; }
syncMute();
muteBtn.onclick = () => { muted = !muted; saved.muted = muted; persist(); syncMute(); };
function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  pop() { tone(900, 0.12, 'triangle', 0.25, 0.2); },
  perfect() { tone(660, 0.12, 'sine', 0.15); setTimeout(() => tone(990, 0.2, 'sine', 0.15), 90); },
  good() { tone(520, 0.18, 'sine', 0.12, 1.4); },
  meh() { tone(300, 0.2, 'sine', 0.1, 0.8); }
};

/* ---------- screens ---------- */
const $ = id => document.getElementById(id);
const screens = { pick: $('pickScreen'), play: $('playScreen'), end: $('endScreen') };
function show(name) { for (const k in screens) screens[k].hidden = k !== name; }

function renderPick() {
  const box = $('pick'); box.innerHTML = '';
  for (const b of BUDDIES) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'buddy'; btn.setAttribute('aria-pressed', String(b.id === saved.buddy));
    const best = saved.best[b.id];
    btn.innerHTML = `<span class="face"><img src="${b.url}" alt=""></span>
      <span><h3>${b.name}</h3><div class="perk">${b.perk}</div><p>${b.blurb}</p>
      <div class="best">${best != null ? `Best: <b>${best}</b>` : 'No games yet'}</div></span>`;
    btn.onclick = () => { saved.buddy = b.id; persist(); renderPick(); };
    btn.ondblclick = () => startGame();
    box.appendChild(btn);
  }
}
$('start').onclick = () => startGame();
$('again').onclick = () => startGame();
$('change').onclick = () => { renderPick(); show('pick'); };

/* ---------- canvas & scene ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const ambient = [], weeds = [];
function resize() {
  const w = cv.parentElement.clientWidth;
  const vh = window.innerHeight;
  const h = Math.round(Math.max(360, Math.min(640, vh - 290, w * 1.35)));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = w; H = h;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); cv.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  weeds.length = 0;
  const n = Math.max(4, Math.round(W / 70));
  for (let i = 0; i < n; i++) weeds.push({ x: (i + 0.5) / n * W + (Math.random() - .5) * 30, h: 40 + Math.random() * 70, ph: Math.random() * 6, hue: 130 + Math.random() * 40 });
}
for (let i = 0; i < 26; i++) ambient.push(newAmbient(true));
function newAmbient(anyY) { return { x: Math.random(), y: anyY ? Math.random() : 1.05, r: 1.5 + Math.random() * 4, v: 0.03 + Math.random() * 0.06, ph: Math.random() * 6 }; }

function layout() {
  const cs = Math.min(W * 0.3, H * 0.24, 130);        // buddy size
  const charX = W / 2 - cs * 0.95, charY = H - cs - 14; // top-left of buddy image, beside the wand
  const ringX = W / 2, ringY = charY + cs * 0.1;   // wand ring the bubble grows out of
  const top = 56;
  const rmax = Math.min(W * 0.42, (ringY - top) / 2);
  return { cs, charX, charY, ringX, ringY, rmax };
}

/* ---------- game state ---------- */
let g = null;
function startGame() {
  const buddy = BUDDIES.find(b => b.id === saved.buddy);
  const rounds = [];
  for (let i = 0; i < ROUNDS; i++) {
    const shape = i < 2 ? 'round' : SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
    rounds.push({ shape, target: 0.35 + Math.random() * 0.6 }); // share of the biggest bubble that fits
  }
  g = { buddy, rounds, i: 0, score: 0, streak: 0, results: [], state: 'ready', r: 0, hold: 0, readyAt: 0, flyers: [], bits: [], label: null };
  show('play'); resize(); renderPips(); updateHud();
  $('hint').textContent = 'Hold anywhere on the water (or Space) to blow';
}
const cur = () => g.rounds[g.i];
function updateHud() {
  $('score').textContent = g.score;
  $('round').textContent = `${Math.min(g.i + 1, ROUNDS)}/${ROUNDS}`;
  $('shape').textContent = SHAPES[cur() ? cur().shape : 'round'].name;
}
function renderPips() {
  const box = $('pips'); box.innerHTML = '';
  for (let i = 0; i < ROUNDS; i++) {
    const p = document.createElement('i'), r = g.results[i];
    if (r) p.style.background = r.color;
    else if (i === g.i) p.style.boxShadow = '0 0 0 2px var(--sea) inset';
    box.appendChild(p);
  }
}

// how fast the bubble grows (in "rmax per second"); later bubbles blow faster, and holding longer speeds it up
function growRate() {
  const ramp = 0.38 + g.i * 0.035;
  const surge = 0.7 + 0.7 * Math.min(1, g.hold / 1.1);
  return ramp * surge * g.buddy.speed;
}

function press() {
  if (!g || g.state !== 'ready' || performance.now() < g.readyAt) return;
  g.state = 'blowing'; g.r = 0.02; g.hold = 0;
  $('hint').textContent = 'Let go when it fills the shape';
  try { actx && actx.state === 'suspended' && actx.resume(); } catch {}
}
function release() {
  if (!g || g.state !== 'blowing') return;
  judge(false);
}
function judge(popped) {
  const rd = cur(), L = layout();
  const err = popped ? 1 : (g.r - rd.target) / rd.target;
  const a = Math.abs(err);
  let pts, word, color;
  if (popped) { pts = 0; word = 'POP!'; color = '#ff5e1a'; g.streak = 0; sfx.pop(); }
  else if (a <= 0.03) { g.streak++; pts = 100 + 25 * (g.streak - 1); word = g.streak > 1 ? `PERFECT ×${g.streak}` : 'PERFECT'; color = '#e8ff47'; sfx.perfect(); }
  else if (a <= 0.07) { g.streak = 0; pts = 75; word = 'GREAT'; color = '#47d7ff'; sfx.good(); }
  else if (a <= 0.12) { g.streak = 0; pts = 50; word = 'GOOD'; color = '#7fd98a'; sfx.good(); }
  else if (a <= 0.2) { g.streak = 0; pts = 25; word = 'OKAY'; color = '#b06bff'; sfx.meh(); }
  else { g.streak = 0; pts = 5; word = err < 0 ? 'TOO SMALL' : 'TOO BIG'; color = 'rgba(236,233,224,.5)'; sfx.meh(); }
  pts = Math.round(pts * g.buddy.mult);
  g.score += pts;
  const off = popped ? 'Blew it too far' : a <= 0.03 ? 'Spot on' : `${Math.round(a * 100)}% too ${err < 0 ? 'small' : 'big'}`;
  g.results.push({ pts, word, color, shape: rd.shape });
  g.label = { word, sub: `+${pts} · ${off}`, color, t: 0 };
  const sh = SHAPES[rd.shape], R = g.r * L.rmax;
  const cx = L.ringX, cy = L.ringY - R * sh.bottom;
  if (popped) {
    for (let k = 0; k < 18; k++) { const an = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 160; g.bits.push({ x: cx + Math.cos(an) * R, y: cy + Math.sin(an) * R, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 0.6 }); }
  } else {
    g.flyers.push({ shape: rd.shape, R, x: cx, y: cy, vx: (Math.random() - .5) * 30, vy: -40, t: 0, sparkle: a <= 0.03 });
  }
  g.state = 'result'; g.r = 0;
  renderPips(); updateHud();
  $('hint').textContent = '';
  setTimeout(() => {
    if (!g) return;
    g.i++;
    if (g.i >= ROUNDS) { finish(); return; }
    g.state = 'ready'; g.readyAt = performance.now() + 150; g.label = null;
    updateHud(); renderPips();
    $('hint').textContent = 'Hold to blow the next one';
  }, 1300);
}

function finish() {
  g.state = 'done';
  const b = g.buddy, prev = saved.best[b.id];
  const isBest = prev == null || g.score > prev;
  if (isBest) saved.best[b.id] = g.score;
  persist();
  $('endFace').src = b.url; $('endName').textContent = `${b.name}'s ten bubbles`;
  $('endScore').textContent = g.score;
  const perfects = g.results.filter(r => r.word.startsWith('PERFECT')).length, pops = g.results.filter(r => r.word === 'POP!').length;
  $('endNote').innerHTML = (isBest && prev != null ? '<span class="newbest">New best!</span> ' : prev != null ? `Best: ${prev}. ` : '') +
    `${perfects} perfect, ${pops} popped.`;
  const t = $('tally'); t.innerHTML = '';
  g.results.forEach((r, i) => {
    const d = document.createElement('div');
    d.innerHTML = `<small>${i + 1} · ${SHAPES[r.shape].name}</small><b style="color:${r.color}">${r.pts}</b>`;
    t.appendChild(d);
  });
  show('end');
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); press(); });
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (!screens.play.hidden) { e.preventDefault(); if (!e.repeat) press(); }
});
window.addEventListener('keyup', e => { if ((e.code === 'Space' || e.code === 'Enter') && !screens.play.hidden) release(); });
window.addEventListener('blur', release);
window.addEventListener('resize', () => { if (!screens.play.hidden) resize(); });

/* ---------- drawing ---------- */
function drawShapePath(kind, cx, cy, sx, sy) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sx, sy);
  ctx.beginPath(); SHAPES[kind].path(ctx);
  ctx.restore();
}
function drawBubble(kind, cx, cy, R, time, alpha = 1) {
  const wob = 0.025 * Math.sin(time * 9);
  const sx = R * (1 + wob), sy = R * (1 - wob);
  ctx.save(); ctx.globalAlpha = alpha;
  drawShapePath(kind, cx, cy, sx, sy);
  const fill = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.1);
  fill.addColorStop(0, 'rgba(255,255,255,.22)'); fill.addColorStop(.6, 'rgba(160,225,255,.10)'); fill.addColorStop(1, 'rgba(200,160,255,.22)');
  ctx.fillStyle = fill; ctx.fill();
  const h = (time * 40) % 360;
  const st = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  st.addColorStop(0, `hsla(${h},90%,75%,.9)`); st.addColorStop(.5, `hsla(${h + 120},90%,80%,.9)`); st.addColorStop(1, `hsla(${h + 240},90%,75%,.9)`);
  ctx.strokeStyle = st; ctx.lineWidth = Math.max(1.5, R * 0.035); ctx.stroke();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.ellipse(cx - R * .38, cy - R * .38, R * .14, R * .07, -0.7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - R * .18, cy - R * .52, R * .035, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  if (!screens.play.hidden && g) { step(dt); draw(); }
  requestAnimationFrame(frame);
}
function step(dt) {
  for (const a of ambient) { a.y -= a.v * dt; if (a.y < -0.05) Object.assign(a, newAmbient(false)); }
  if (g.state === 'blowing') {
    g.hold += dt;
    g.r += growRate() * dt;
    const rd = cur();
    if (g.r > Math.min(1, rd.target * 1.3)) judge(true); // overblown: pops
  }
  for (const f of g.flyers) { f.t += dt; f.vy -= 60 * dt; f.x += (f.vx + Math.sin(f.t * 3) * 25) * dt; f.y += f.vy * dt; }
  g.flyers = g.flyers.filter(f => f.y + f.R > -20 && f.t < 4);
  for (const b of g.bits) { b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.92; b.vy *= 0.92; }
  g.bits = g.bits.filter(b => b.life > 0);
  if (g.label) g.label.t += dt;
}
function draw() {
  const L = layout();
  // water
  const sea = ctx.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, '#0d4a66'); sea.addColorStop(.55, '#0a2c44'); sea.addColorStop(1, '#071a2a');
  ctx.fillStyle = sea; ctx.fillRect(0, 0, W, H);
  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const x = W * (0.15 + i * 0.25) + Math.sin(clock * 0.4 + i) * 20;
    const gr = ctx.createLinearGradient(0, 0, 0, H * 0.8); gr.addColorStop(0, 'rgba(160,230,255,.08)'); gr.addColorStop(1, 'rgba(160,230,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x - 18, 0); ctx.lineTo(x + 18, 0); ctx.lineTo(x + 70, H * 0.8); ctx.lineTo(x - 30, H * 0.8); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // ambient bubbles
  ctx.strokeStyle = 'rgba(200,240,255,.35)'; ctx.lineWidth = 1;
  for (const a of ambient) { ctx.beginPath(); ctx.arc(a.x * W + Math.sin(clock * 2 + a.ph) * 6, a.y * H, a.r, 0, Math.PI * 2); ctx.stroke(); }
  // sand + weeds
  ctx.fillStyle = '#c9b07a'; ctx.beginPath(); ctx.moveTo(0, H - 22);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 22 + Math.sin(x * 0.03) * 4);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  for (const w of weeds) {
    ctx.strokeStyle = `hsl(${w.hue},55%,38%)`; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x, H - 18);
    const sway = Math.sin(clock * 1.3 + w.ph) * 12;
    ctx.quadraticCurveTo(w.x + sway, H - 18 - w.h * 0.6, w.x + sway * 1.4, H - 18 - w.h); ctx.stroke();
  }
  // buddy + wand
  const b = g.buddy;
  if (b.img.complete) ctx.drawImage(b.img, L.charX, L.charY, L.cs, L.cs);
  ctx.strokeStyle = '#e9d79a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(L.charX + L.cs * 0.7, L.charY + L.cs * 0.55); ctx.lineTo(L.ringX, L.ringY + 8); ctx.stroke();
  ctx.strokeStyle = '#ff8fc0'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(L.ringX, L.ringY, 16, 6, 0, 0, Math.PI * 2); ctx.stroke();

  const rd = cur();
  if (rd && (g.state === 'ready' || g.state === 'blowing')) {
    const sh = SHAPES[rd.shape], TR = rd.target * L.rmax;
    // target outline + perfect band
    ctx.save();
    drawShapePath(rd.shape, L.ringX, L.ringY - TR * sh.bottom, TR, TR);
    ctx.setLineDash([7, 7]); ctx.lineDashOffset = -clock * 20; ctx.strokeStyle = 'rgba(232,255,71,.8)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    // pop line, faint
    const PR = Math.min(1, rd.target * 1.3) * L.rmax;
    ctx.save();
    drawShapePath(rd.shape, L.ringX, L.ringY - PR * sh.bottom, PR, PR);
    ctx.setLineDash([2, 10]); ctx.strokeStyle = 'rgba(255,94,26,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    if (g.state === 'blowing') {
      const R = g.r * L.rmax;
      drawBubble(rd.shape, L.ringX, L.ringY - R * sh.bottom, R, clock);
    }
  }
  for (const f of g.flyers) {
    drawBubble(f.shape, f.x, f.y, f.R, clock, Math.max(0, Math.min(1, 3.5 - f.t)));
    if (f.sparkle) {
      ctx.fillStyle = '#e8ff47';
      for (let k = 0; k < 5; k++) { const an = clock * 2 + k * 1.256, rr = f.R * 1.15; ctx.beginPath(); ctx.arc(f.x + Math.cos(an) * rr, f.y + Math.sin(an) * rr, 2.5, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  ctx.fillStyle = 'rgba(200,240,255,.85)';
  for (const p of g.bits) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;

  if (g.label) {
    const t = g.label.t, sc = 1 + Math.max(0, 0.25 - t) * 1.5;
    ctx.save(); ctx.translate(W / 2, 40); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.fillStyle = g.label.color;
    ctx.font = `400 ${Math.round(Math.min(44, W * 0.1))}px "Bebas Neue", Impact, sans-serif`;
    ctx.fillText(g.label.word, 0, 8);
    ctx.font = '500 13px "DM Sans", system-ui, sans-serif'; ctx.fillStyle = 'rgba(236,233,224,.85)';
    ctx.fillText(g.label.sub, 0, 28);
    ctx.restore();
  } else if (g.state === 'ready' && g.i === 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(236,233,224,.8)'; ctx.font = '500 14px "DM Sans", system-ui, sans-serif';
    ctx.fillText('Fill the yellow dotted shape', W / 2, 32);
  }
}

renderPick();
requestAnimationFrame(frame);

</script>
</body>
</html>
