<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Blower · Roshan Adhikari</title>
<meta name="description" content="A 3D undersea timing game. Hold to blow a bubble, let go when it fills the shape. Build combos, hit Fever, dodge jellyfish. Free, no sign-up.">
<meta name="theme-color" content="#060606">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/assets/arcade-back.css">
<style>
:root {
  color-scheme: dark;
  --bg: #060606;
  --card: #0d0d0d;
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(255, 255, 255, .14);
  --txt: #ece9e0;
  --mute: rgba(236, 233, 224, .62);
  --y: #e8ff47;
  --o: #ff5e1a;
  --sea: #47d7ff;
  --pink: #ff6b9a;
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --gutter: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--txt);
  font: 400 15px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) var(--gutter) env(safe-area-inset-bottom);
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--y); outline-offset: 3px; }
[hidden] { display: none !important; }

.top, main, footer { width: 100%; max-width: 720px; margin: 0 auto; }
.top { height: 60px; display: flex; align-items: center; justify-content: space-between; flex: none; }
main { flex: 1 0 auto; padding: 0 0 20px; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 15px; color: var(--mute); background: rgba(13,13,13,.72); }
.icon-btn:hover { color: var(--txt); }

/* ---------- the stage: 3D canvas with DOM overlays ---------- */
.stage {
  position: relative; width: 100%; height: clamp(280px, calc(100vh - 72px), 880px); height: clamp(280px, calc(100dvh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 880px);
  border-radius: 22px; overflow: hidden; border: 1px solid var(--line2); background: #0b3552;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.ov { position: absolute; pointer-events: none; }
.ov button, .ov .live { pointer-events: auto; }
.shadow-txt { text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.35); }

.loading { inset: 0; display: grid; place-items: center; background: #0b3552; font-family: var(--display); font-size: 28px; letter-spacing: .05em; color: var(--sea); transition: opacity .5s; }
.loading.gone { opacity: 0; }

/* HUD */
.hud { inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: 12px 14px; gap: 8px; }
.hud small { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: rgba(236,233,224,.75); }
.hud .score b { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: .95; font-variant-numeric: tabular-nums; }
.mult { display: inline-block; margin-top: 4px; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.12); font-weight: 600; font-size: 13px; transition: background .2s, color .2s; }
.mult.hot { background: var(--y); color: #0b0b0b; }
.mult.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.35); } }
.hud .mid { text-align: center; }
.hud .mid b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; color: var(--sea); letter-spacing: .04em; }
.hud .lives { justify-self: end; display: flex; gap: 3px; font-size: 20px; line-height: 1; }
.hud .lives i { font-style: normal; color: #ff5e7a; transition: transform .3s, opacity .3s; }
.hud .lives i.lost { opacity: .18; transform: scale(.8); filter: grayscale(1); }

.banner { left: 50%; top: 86px; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px; font-family: var(--display); font-size: 22px; letter-spacing: .06em; white-space: nowrap; opacity: 0; }
.banner.show { animation: banner 2s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -10px) scale(.8); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 20%, 80% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.fever-tag { left: 50%; bottom: 52px; transform: translateX(-50%); font-family: var(--display); font-size: 20px; letter-spacing: .08em; color: #0b0b0b; background: linear-gradient(90deg, #ffe066, #ff8fc0, #7fe3ff, #ffe066); background-size: 300% 100%; animation: feverbg 1.4s linear infinite; padding: 4px 14px; border-radius: 999px; }
@keyframes feverbg { to { background-position: 300% 0; } }

.judge { left: 0; right: 0; top: 20%; text-align: center; opacity: 0; }
.judge b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(48px, 13vw, 76px); line-height: .9; letter-spacing: .03em; }
.judge span { font-weight: 600; font-size: 15px; }
.judge.show { animation: judge 1.15s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes judge { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 25% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }

.hint { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(4,14,22,.55); font-size: 13px; color: rgba(236,233,224,.85); white-space: nowrap; transition: opacity .3s; }
.hint:empty { opacity: 0; }

/* buddy picker */
.pick { inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 16px 16px; }
.pick-top { text-align: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 11vw, 72px); line-height: .9; letter-spacing: .02em; white-space: nowrap; }
h1 span { color: var(--sea); }
/* the title hangs on a wooden plank sign, like an old Saturday-morning cartoon title card */
.plank {
  position: relative; display: inline-block; padding: 10px 22px 8px; transform: rotate(-2deg);
  background: repeating-linear-gradient(180deg, #b2733f 0 30%, #9c6233 30% 33%, #b87a45 33% 64%, #9c6233 64% 67%, #ad6f3c 67% 100%);
  border: 3px solid #5a3417; border-radius: 10px 14px 9px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.18);
  color: #fff3d6; -webkit-text-stroke: 1.5px #3d230f; text-shadow: 0 3px 0 #3d230f; animation: sway 4s ease-in-out infinite;
}
.plank span { color: #7fe8ff; }
.plank::before, .plank::after { content: ""; position: absolute; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #d9c7a0; box-shadow: inset -1px -1px 0 #6b5a3a; }
.plank::before { left: 9px; } .plank::after { right: 9px; }
@keyframes sway { 50% { transform: rotate(1.5deg) translateY(2px); } }
.icons { display: flex; gap: 8px; }

/* narrator card between levels */
.card-ov { inset: 0; display: grid; place-items: center; opacity: 0; }
.card-ov.show { animation: cardin 2.2s ease forwards; }
.card-ov div { padding: 14px 26px 10px; text-align: center; transform: rotate(-3deg); background: repeating-linear-gradient(180deg, #b2733f 0 46%, #9c6233 46% 50%, #b87a45 50% 100%); border: 3px solid #5a3417; border-radius: 12px; box-shadow: 0 8px 0 rgba(0,0,0,.3); }
.card-ov b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1; color: #fff3d6; -webkit-text-stroke: 1px #3d230f; text-shadow: 0 3px 0 #3d230f; }
.card-ov small { font-weight: 600; font-size: 13px; color: #ffe9b8; letter-spacing: .08em; text-transform: uppercase; }
@keyframes cardin { 0% { opacity: 0; transform: scale(.6) rotate(8deg); } 14% { opacity: 1; transform: scale(1.06) rotate(-1deg); } 22%, 80% { opacity: 1; transform: scale(1) rotate(0); } 100% { opacity: 0; transform: scale(.9) translateY(-20px); } }

/* bubble wipe: a rush of big bubbles between scenes */
.wipe { inset: 0; overflow: hidden; z-index: 5; }
.wipe i { position: absolute; bottom: -40%; border-radius: 50%; border: 3px solid rgba(220,250,255,.9); background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.75) 0 9%, rgba(190,240,255,.28) 10% 60%, rgba(150,200,255,.4) 100%); opacity: 0; }
.wipe.go i { animation: rush .95s cubic-bezier(.3,.1,.5,1) forwards; }
@keyframes rush { 0% { opacity: 1; transform: translateY(0) scale(.8); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-190vh) scale(1.15); } }
.pick-top p { color: rgba(236,233,224,.8); font-size: 14px; margin-top: 6px; }
.pick-card { width: 100%; max-width: 420px; margin: 0 auto; padding: 14px; border-radius: 20px; background: rgba(4,14,22,.62); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); text-align: center; display: grid; gap: 8px; pointer-events: auto; }
.sel { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; }
.arrow { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line2); font-size: 22px; line-height: 1; }
.arrow:hover { border-color: var(--sea); color: var(--sea); }
.sel h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: .04em; }
.perk { color: var(--sea); font-weight: 600; font-size: 13px; }
.blurb { color: var(--mute); font-size: 13px; }
.best { font-size: 12.5px; color: var(--mute); }
.best b { color: var(--y); }
.custom-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
.btn.small { min-height: 38px; padding: 0 16px; font-size: 13.5px; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.2); }
.dots i.on { background: var(--sea); }
.tips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.tips span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.07); color: rgba(236,233,224,.78); }

.btn { min-height: 48px; padding: 0 26px; border-radius: 999px; font-size: 15px; font-weight: 600; border: 1px solid var(--line2); white-space: nowrap; transition: border-color .2s, background .2s, transform .1s; }
.btn:hover { border-color: rgba(255, 255, 255, .3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--y); color: var(--bg); border-color: var(--y); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* game over */
.over { inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(4,14,22,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: auto; animation: fade .4s; }
@keyframes fade { from { opacity: 0; } }
.over-card { width: 100%; max-width: 400px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.over-card small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.over-card .big { font-family: var(--display); font-size: 96px; line-height: .85; color: var(--y); }
.newbest { color: var(--y); font-weight: 600; }
.stats { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--line); padding: 8px 4px; }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; }
.stats small { font-size: 10px; letter-spacing: .06em; }

/* ---------- responsive ---------- */
@media (min-width: 1280px) { .top, main, footer { max-width: 960px; } }
/* shorter portrait screens: trim the picker so the buddy stays visible */
@media (max-height: 760px) {
  .tips { display: none; }
  .pick-top p { font-size: 13px; }
  .pick-card { gap: 6px; padding: 12px; }
  .over-card .big { font-size: 72px; }
}
@media (max-height: 640px), (max-width: 340px) {
  .blurb { display: none; }
  .pick-top p { display: none; }
  .sel h2 { font-size: 28px; }
  .btn { min-height: 44px; }
  .plank { padding: 8px 16px 6px; }
}
/* landscape phones: title top-left, buddy card on the right, everything compact */
@media (max-height: 520px) and (min-aspect-ratio: 5/4) {
  .top { height: 52px; }
  .stage { height: calc(100vh - 60px); height: calc(100dvh - 60px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 260px; border-radius: 16px; }
  .pick { flex-direction: row; align-items: flex-start; justify-content: space-between; padding: 12px; gap: 12px; }
  .pick-top { text-align: left; }
  h1 { font-size: clamp(28px, 6.5vw, 44px); }
  .pick-card { width: min(320px, 46%); margin: 0; align-self: flex-end; padding: 10px; gap: 4px; }
  .pick-card .best { display: none; }
  .btn { min-height: 40px; padding: 0 18px; font-size: 14px; }
  .sel { grid-template-columns: 40px 1fr 40px; }
  .arrow { width: 38px; height: 38px; }
  .perk { font-size: 12px; }
  .hud { padding: 8px 12px; }
  .hud .score b { font-size: 30px; }
  .banner { top: 58px; font-size: 18px; }
  .judge { top: 12%; }
  .judge b { font-size: 44px; }
  .over { padding: 8px; }
  .over-card { gap: 6px; max-width: 520px; }
  .over-card .big { font-size: 52px; }
  .stats div { padding: 4px; }
  .stats b { font-size: 20px; }
  .fever-tag { bottom: 44px; font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .plank { animation: none; }
  .wipe { display: none; }
  .card-ov.show, .banner.show, .judge.show { animation-duration: 1.6s; }
}

footer { border-top: 1px solid var(--line); padding: 16px 0 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--mute); flex: none; }
footer a:hover { color: var(--txt); }
@media (max-width: 420px) {
  .hud .score b { font-size: 34px; }
  .stats b { font-size: 22px; }
}

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
// if the 3D module can't load (offline, very old browser), say so instead of hanging on "Diving in…"

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const UP = new THREE.Vector3(0, 1, 0);

/* =====================================================================
   Renderer, camera, environment
   ===================================================================== */
const stage = $('stage'), cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 120);
const CAM_LOOK = new THREE.Vector3(0, 3.7, 0);
let camBase = new THREE.Vector3(0, 4.3, 16);
const PICK_POS = new THREE.Vector3(0, 2.6, 3);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function gradientTexture(stops, w = 2, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, h);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = gradientTexture([[0, '#1a86b3'], [0.45, '#0c4a6e'], [1, '#08263b']]);
scene.fog = new THREE.Fog(0x0c3f5e, 14, 42);

scene.add(new THREE.HemisphereLight(0xbff0ff, 0x4a3a20, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 10, 6); scene.add(sun);

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(4.7 / t, 3.15 / (t * camera.aspect));
  // tall phone screens see more height than the play needs: lift the view so the sea floor sits near the bottom
  const halfH = dist * t;
  CAM_LOOK.set(0, Math.max(3.7, halfH - 1.1), 0);
  camBase.set(0, CAM_LOOK.y + .4, dist);
  camera.updateProjectionMatrix();
  framePick();
}
// On the picker, fit the buddy into the open water between the title and the card (or left of the card on landscape
// phones), measured from the real layout, so it never hides behind the overlays at any screen size.
let PICK_SCALE = 1.7;
const BUDDY_H = 1.9; // rough height of every buddy at scale 1
function framePick() {
  const st = stage.getBoundingClientRect(), pick = document.getElementById('pick');
  if (!st.height || !pick || pick.hidden) return;
  const card = pick.querySelector('.pick-card').getBoundingClientRect(), top = pick.querySelector('.pick-top').getBoundingClientRect();
  const land = st.height <= 520 && st.width / st.height >= 1.25;
  const topPx = top.bottom - st.top + 8, botPx = land ? st.height - 12 : card.top - st.top - 8;
  const depth = camBase.z - 3, wpp = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * depth / st.height;
  const gap = Math.max(40, botPx - topPx) * wpp;

function rimMat(color, { power = 2.4, intensity = 1, base = 0, stripes = 0, additive = true } = {}) {

    uniforms: { uColor: { value: new THREE.Color(color) }, uPower: { value: power }, uInt: { value: intensity }, uBase: { value: base }, uStripes: { value: stripes }, uTime: { value: 0 } },
    vertexShader: `

}

function press() {
  if (mode !== 'play' || !g || g.state !== 'ready') return;
  g.state = 'blowing'; g.r = .03; g.hold = 0;
  $('hint').textContent = '';
  startBlowSound();
}
function release() {
  if (!g || g.state !== 'blowing') return;
  stopBlowSound();
  judge(false);
}

function judge(popped) {
  const rd = g.round, b = g.buddy, sh = SHAPES[rd.shape];
  const tgt = currentTarget();
  const err = (g.r - tgt) / tgt, a = Math.abs(err);
  let grade, base, color;
  if (popped) { grade = 'POP!'; base = 0; color = '#ff5e1a'; }
  else if (a <= b.window) { grade = 'PERFECT'; base = 100; color = '#e8ff47'; }
  else if (a <= .08) { grade = 'GREAT'; base = 60; color = '#47d7ff'; }
  else if (a <= .14) { grade = 'GOOD'; base = 35; color = '#7fd98a'; }
  else if (a <= .22) { grade = 'OKAY'; base = 15; color = '#c79bff'; }
  else { grade = err < 0 ? 'TOO SMALL' : 'TOO BIG'; base = 0; color = '#ff8a8a'; }
  const good = grade === 'PERFECT' || grade === 'GREAT', lose = base === 0;
  g.combo = good ? g.combo + 1 : 0; g.bestCombo = Math.max(g.bestCombo, g.combo);
  const mult = 1 + Math.min(4, Math.floor(g.combo / 2));
  const feverOn = g.fever > 0;
  let pts = Math.round(base * mult * b.mult * (rd.golden ? 3 : 1) * (feverOn ? 2 : 1));
  g.score += pts;
  if (feverOn) g.fever--;

  const R = g.r * RMAX, centre = new THREE.Vector3(RING.x, RING.y + R * sh.hy, RING.z);
  let sub = `+${pts.toLocaleString()}`;
  if (mult > 1 && pts) sub += ` · combo ×${mult}`;
  if (rd.golden && pts) sub += ' · golden ×3';
  if (!popped && !lose && grade !== 'PERFECT') sub += ` · ${Math.round(a * 100)}% too ${err < 0 ? 'small' : 'big'}`;
  if (popped) sub = jellyHit ? 'The jellyfish stung it' : 'Blew it too far';

  if (grade === 'PERFECT') {
    g.perfects++; g.perfectRun++;
    sfx.perfect(g.combo);
    burst(centre, 40, rd.golden ? [0xffd84a, 0xfff3a0] : [0xe8ff47, 0x7fe3ff, 0xff8fc0, 0xffffff], 5, .07, -1, R * sh.hx);
    react = { kind: 'happy', t: 0 };
    if (g.perfectRun >= 3) {
      setTimeout(() => burst(chestLid.userData.pos, 50, [0xffd84a, 0xffe98a, 0xfff6c8], 5, .07, -3, .3), 350);
      g.perfectRun = 0; g.fever = 5; g.fevers++;
      const gained = g.lives < 5; if (gained) g.lives++;
      setTimeout(() => { sfx.fever(); banner(gained ? 'FEVER! ×2 points · +1 life' : 'FEVER! ×2 points', '#ffe066'); renderLives(true); }, 350);
    }
  } else {
    g.perfectRun = 0;
    if (good) { sfx.good(); react = { kind: 'happy', t: .4 }; }
    else if (!lose) sfx.meh();
  }
  if (lose) {
    g.lives--; renderLives();
    shake = popped ? .35 : .18;
    react = { kind: 'sad', t: 0 };
    if (popped) { sfx.pop(); burst(centre, 34, [0xcff6ff, 0xffffff], 6, .07, -3, R * sh.hx); }
    else sfx.miss();
  }
  if (!popped) floaters.push({ shape: rd.shape, golden: rd.golden || feverOn, R, pos: centre.clone().setY(RING.y), vy: .4, vx: rand(-.3, .3), t: 0, spin: rand(-.6, .6) });

  showJudge(grade, sub, color);
  bubble.visible = false; ghost.visible = limit.visible = false; jelly.visible = false;
  jellyHit = false;
  g.state = 'result'; g.r = 0;
  updateHud();
  setTimeout(() => {
    if (mode !== 'play' || !g) return;
    if (g.lives <= 0) gameOver(); else nextRound();
  }, lose ? 1300 : 1050);
}
let jellyHit = false;

function gameOver() {
  mode = 'over'; g.state = 'over';
  const b = g.buddy, prev = saved.best[b.id];
  const isBest = prev == null || g.score > prev;
  if (isBest) saved.best[b.id] = g.score;
  persist();
  $('oWho').textContent = `${b.id === 'custom' ? (saved.customName || b.name) : b.name} · game over`;
  $('oScore').textContent = g.score.toLocaleString();
  $('oNote').innerHTML = isBest && prev != null ? '<span class="newbest">New best!</span>' : prev != null ? `Best: ${prev.toLocaleString()}` : 'First game in the books.';
  $('oStats').innerHTML = [[g.n + 1, 'Bubbles'], [g.perfects, 'Perfects'], [g.bestCombo, 'Best combo'], [g.fevers, 'Fevers']]
    .map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join('');
  $('fever').hidden = true; $('hint').textContent = '';
  $('over').hidden = false;
  bubbleWipe();
}

/* ---------- HUD helpers ---------- */
let lastMult = 1;
function updateHud() {
  if (!g) return;
  $('score').textContent = g.score.toLocaleString();
  const mult = 1 + Math.min(4, Math.floor(g.combo / 2));
  const m = $('mult'); m.textContent = `×${mult}` + (g.combo ? ` · ${g.combo} combo` : '');
  m.classList.toggle('hot', mult > 1);
  if (mult !== lastMult) { m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump'); lastMult = mult; }
  if (g.round) $('shape').textContent = (g.round.golden ? '★ ' : '') + SHAPES[g.round.shape].name;
  $('lvl').textContent = `Level ${g.lvl} · bubble ${g.n + 1}`;
  $('fever').hidden = !(g.fever > 0);
  $('fever').textContent = `FEVER ×2 · ${g.fever} left`;
}
function renderLives(gain) {
  const n = Math.max(3, g.lives);
  $('lives').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < g.lives ? '' : 'lost'}">♥</i>`).join('');
  if (gain) sfx.life();
}
function banner(text, color) {
  const el = $('banner'); el.textContent = text; el.style.color = color; el.style.background = 'rgba(4,14,22,.6)';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showJudge(word, sub, color) {
  const el = $('judge'); el.querySelector('b').textContent = word; el.querySelector('b').style.color = color; el.querySelector('span').textContent = sub;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e => { if (mode !== 'play') return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {} ac && !muted && ac(); press(); });
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (mode === 'pick') {
    if (e.key === 'ArrowLeft') cycle(-1);
    else if (e.key === 'ArrowRight') cycle(1);
    else if ((e.code === 'Enter' || e.code === 'Space') && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); startGame(); }
    return;
  }
  if (mode === 'play' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); if (!e.repeat) press(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });
window.addEventListener('blur', release);
document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });

/* =====================================================================
   Main loop
   ===================================================================== */
const dummy = new THREE.Object3D();
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
let last = performance.now(), firstFrame = true;

function step(dt) {
  clock += dt;
  const t = clock;

  // ambience
  kelps.forEach(k => k.joints.forEach((j, i) => { j.rotation.z = k.amp * Math.sin(t * 1.2 + k.ph + i * .5); j.rotation.x = k.amp * .5 * Math.cos(t * .9 + k.ph + i * .4); }));
  rays.forEach(r => { r.m.material.opacity = .1 + .08 * Math.sin(t * .6 + r.ph); });
  fishes.forEach(f => { f.f.position.x += f.dir * f.v * dt; f.f.position.y += Math.sin(t * 1.5 + f.ph) * .003; f.t.rotation.y = .5 * Math.sin(t * 10 + f.ph); if (f.f.position.x > 16) f.f.position.x = -16; if (f.f.position.x < -16) f.f.position.x = 16; });
  amb.forEach((a, i) => {
    a.y += a.v * dt; if (a.y > 12) { a.y = -.2; a.x = rand(-10, 10); }
    dummy.position.set(a.x + Math.sin(t * 2 + a.ph) * .15, a.y, a.z); dummy.scale.setScalar(a.r); dummy.updateMatrix(); ambMesh.setMatrixAt(i, dummy.matrix);
  });
  ambMesh.instanceMatrix.needsUpdate = true;
  ghostMat.uniforms.uTime.value = limitMat.uniforms.uTime.value = t;

  // buddy placement + animation
  const b = BUDDIES[buddyIdx], m = b.model;
  buddyMove = Math.min(1, buddyMove + dt * 2.2);
  const e = 1 - Math.pow(1 - buddyMove, 3);
  const inGame = mode !== 'pick';
  const from = inGame ? PICK_POS : GAME_POS, to = inGame ? GAME_POS : PICK_POS;
  m.g.position.lerpVectors(from, to, e);
  const sFrom = inGame ? PICK_SCALE : 1, sTo = inGame ? 1 : PICK_SCALE;
  m.g.scale.setScalar(sFrom + (sTo - sFrom) * e);
  let yaw = inGame ? .55 : Math.sin(t * .7) * .55;
  let hop = 0, roll = 0;
  if (react) {
    react.t += dt;
    if (react.kind === 'happy') { const p = Math.min(1, react.t / .7); hop = Math.sin(p * Math.PI) * (inGame ? .7 : .25 * PICK_SCALE); yaw += p * Math.PI * 2; if (p >= 1) react = null; }
    else { const p = Math.min(1, react.t / .7); roll = Math.sin(p * Math.PI * 6) * .25 * (1 - p); if (p >= 1) react = null; }
  }
  m.g.position.y += hop; m.g.rotation.set(0, yaw, roll);
  const blowing = g && g.state === 'blowing';
  m.anim(t, blowing ? Math.min(1, g.hold * 3) : 0, inGame ? .55 : Math.sin(t * .7) * .55);
  shadowBlob.visible = inGame; // the picker floats the buddy mid-water, so no floor shadow there
  shadowBlob.position.set(m.g.position.x, .03, m.g.position.z); shadowBlob.scale.setScalar(m.g.scale.x * (1.05 - hop * .4));

  // wand
  const showWand = mode !== 'pick' && buddyMove > .6;
  wandRing.visible = wandStick.visible = showWand;
  if (showWand) {
    m.g.updateMatrixWorld(true);
    m.hand.getWorldPosition(tmpA);
    tmpB.set(RING.x - .34, RING.y - .05, RING.z);
    placeBetween(wandStick, tmpA, tmpB);
    wandRing.position.copy(RING); wandRing.position.y = RING.y + (blowing ? Math.sin(t * 30) * .01 : 0);
  }

  // the round
  if (g && g.round && (g.state === 'ready' || g.state === 'blowing')) {
    const rd = g.round, sh = SHAPES[rd.shape];
    const intro = Math.min(1, (t - rd.born) / .35), pop = intro < 1 ? 1 - Math.pow(1 - intro, 3) * (1 - .15 * Math.sin(intro * Math.PI)) : 1;
    const tgt = currentTarget(), yawS = .3 * Math.sin(t * .8);
    ghost.scale.setScalar(tgt * RMAX * pop); ghost.position.copy(RING); ghost.rotation.y = yawS;
    limit.scale.setScalar(rd.lim * RMAX * pop); limit.position.copy(RING); limit.rotation.y = yawS;
    if (rd.jelly) {
      const jp = jellyPos(); jelly.position.copy(jp);
      jelly.rotation.z = -.25 * Math.cos((t - rd.born) * rd.jelly.w + rd.jelly.ph);
      const sq = 1 + .12 * Math.sin(t * 5); jellyBell.scale.set(sq, 2 - sq, sq);
      tentacles.forEach((segs, k) => segs.forEach((s, i) => { s.rotation.x = .35 * Math.sin(t * 4 + k + i * .8); }));
    }
    if (g.state === 'blowing') {
      g.hold += dt;
      const surge = .7 + .75 * Math.min(1, g.hold / 1.1);
      g.r += rd.speed * surge * g.buddy.speed * dt;
      setBlowPitch(g.r);
      const R = g.r * RMAX, wob = .03 * Math.sin(t * 11);
      bubble.visible = true; bubble.position.copy(RING); bubble.rotation.y = yawS;
      bubble.scale.set(R * (1 + wob), R * (1 - wob), R * (1 + wob));
      const fever = g.fever > 0 || rd.golden;
      bubbleMat.color.set(fever ? 0xffe28a : 0xffffff); bubbleRimMat.uniforms.uColor.value.set(fever ? 0xffd84a : 0xbff4ff);
      if (g.r > rd.lim) { stopBlowSound(); judge(true); }
      else if (rd.jelly) {
        const jp = jellyPos(), hx = R * sh.hx, hy = R * sh.hy;
        const dx = jp.x - RING.x, dy = jp.y - (RING.y + hy);
        if ((dx / (hx + .42)) ** 2 + (dy / (hy + .38)) ** 2 < 1) { jellyHit = true; stopBlowSound(); judge(true); }
      }
    }
  }

  // released bubbles float away and pop at the top
  floaters = floaters.filter(f => {
    f.t += dt; f.vy += 1.6 * dt; f.pos.y += f.vy * dt; f.pos.x += (f.vx + Math.sin(f.t * 2.5) * .5) * dt;
    if (f.pos.y - f.R > 8.5 || f.t > 5) { burst(new THREE.Vector3(f.pos.x, f.pos.y + f.R * SHAPES[f.shape].hy, 0), 16, f.golden ? 0xffe066 : 0xcff6ff, 3, .05, -2, f.R * .7); return false; }
    return true;
  });
  floatGroup.children.forEach(c => c.visible = false);
  floaters.forEach((f, i) => {
    const grp = floatMesh(i);
    grp.visible = true; grp.children[0].geometry = grp.children[1].geometry = SHAPES[f.shape].geo;
    grp.children[0].material.color.set(f.golden ? 0xffe28a : 0xffffff);
    grp.position.copy(f.pos); grp.rotation.y = f.t * f.spin; grp.scale.setScalar(f.R);
  });

  // particles
  parts.forEach((p, i) => {
    if (p.life > 0) {
      p.life -= dt; p.vy += p.g * dt; p.vx *= .97; p.vy *= .97; p.vz *= .97;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      dummy.position.set(p.x, p.y, p.z); dummy.scale.setScalar(Math.max(0, p.size * (p.life / p.max)));
    } else dummy.scale.setScalar(0);
    dummy.updateMatrix(); partMesh.setMatrixAt(i, dummy.matrix);
  });
  partMesh.instanceMatrix.needsUpdate = true;

  // fever tint, and the treasure chest swings open while it lasts
  const fev = g && g.fever > 0;
  chestLid.rotation.x += ((fev ? -1.9 : 0) + (fev ? Math.sin(t * 6) * .08 : 0) - chestLid.rotation.x) * Math.min(1, dt * 5);
  scene.fog.color.lerp(tmpCol.set(fev ? 0x3a2a6e : 0x0c3f5e), Math.min(1, dt * 2));

  // camera with gentle drift and shake
  shake = Math.max(0, shake - dt * 1.2);
  camera.position.set(camBase.x + Math.sin(t * .3) * .25 + (Math.random() - .5) * shake, camBase.y + Math.sin(t * .4) * .12 + (Math.random() - .5) * shake, camBase.z);
  camera.lookAt(CAM_LOOK);
}
const floatGroup = new THREE.Group(); scene.add(floatGroup);
function floatMesh(i) {
  while (floatGroup.children.length <= i) {
    const grp = new THREE.Group();
    const body = new THREE.Mesh(SHAPES.round.geo, bubbleMat.clone()), rim = new THREE.Mesh(SHAPES.round.geo, bubbleRimMat);
    rim.renderOrder = 3; grp.add(body, rim); floatGroup.add(grp);
  }
  return floatGroup.children[i];
}

function frame(now) {
  // rAF's timestamp can be earlier than the moment setup finished, so never let a frame step go negative
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = Math.max(last, now);
  step(dt);
  renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; $('loading').classList.add('gone'); setTimeout(() => $('loading').hidden = true, 600); }
  requestAnimationFrame(frame);
}

fit();
loadCustom(saved.customImg).then(() => { if (mode === 'pick') showBuddy(); });
toPick();
buddyMove = 1;
requestAnimationFrame(frame);

</script>
</body>
