<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Momo Drop</title>
<meta name="description" content="Draw lines to guide a falling momo onto the plate. A free physics puzzle game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one 16:9 stage fitted to whatever box it lives in (page, iframe, popup); HUD and menus scale with the stage width. Single deliberate daytime look. */
:root{
  color-scheme:light;
  --paper:#fff6e8; --ink:#3a2418; --crimson:#dc143c; --navy:#003893; --gold:#f2c230;
  --frame:#2a1a12; --shadow:rgba(58,36,24,.18);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;container-type:inline-size;flex:none;
  width:min(100%,calc((100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));
  aspect-ratio:16/9;max-width:100%;border-radius:clamp(6px,1.2cqw,14px);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#ffd9a8}
#stage:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0;aspect-ratio:auto;background:var(--frame)}
#stage:fullscreen canvas{position:absolute;inset:0;margin:auto;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:1.1cqw;padding:1.1cqw 1.4cqw;pointer-events:none;font-size:clamp(10px,1.75cqw,22px)}
.hud>*{pointer-events:auto}
.lvl{font-family:var(--display);font-weight:800;background:var(--paper);padding:.15em .8em;border-radius:999px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
.ink{flex:1;min-width:0;display:flex;align-items:center;gap:.5em;background:var(--paper);border-radius:999px;padding:.35em .8em;box-shadow:0 3px 0 var(--shadow)}
.ink span{font-weight:800;font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.bar{flex:1;height:.6em;border-radius:999px;background:#ead8bf;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:999px;transition:width .08s}
.bar i.low{background:var(--crimson)}
button{font-family:var(--display);font-weight:800;font-size:1em;line-height:1.4;border:0;border-radius:999px;padding:.25em .95em;cursor:pointer;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--shadow);transition:transform .08s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.icon{padding:.25em .6em}
button.go{background:var(--crimson);color:#fff;box-shadow:0 4px 0 #8f0d27;min-width:5.2em}
button.go.reset{background:var(--navy);box-shadow:0 4px 0 #00225a}
.tip{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);background:var(--paper);padding:.35em 1em;border-radius:999px;font-weight:800;font-size:clamp(10px,1.6cqw,20px);box-shadow:0 3px 0 var(--shadow);white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(58,36,24,.38);font-size:clamp(10px,1.7cqw,22px);padding:2cqw;box-sizing:border-box}
.card{background:var(--paper);border-radius:1.2em;padding:1.2em 1.8em;text-align:center;box-shadow:0 .5em 0 var(--shadow);max-width:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:grid;gap:.55em;justify-items:center}
.card h1{font-family:var(--display);font-size:4em;line-height:.9;margin:0;color:var(--crimson);text-wrap:balance}
.card h2{font-family:var(--display);font-size:2.2em;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0;font-weight:600;max-width:28em}
.row{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center}
.big{font-size:1.5em;padding:.2em 1.4em}
.stars{font-size:2.6em;letter-spacing:.1em;color:#e0c9a8;line-height:1}
.stars b{color:var(--gold);-webkit-text-stroke:2px #b98a10}
.grid{display:grid;grid-template-columns:repeat(5,auto);gap:.6em}
.grid button{width:3.1em;height:3.1em;padding:0;border-radius:.8em;display:grid;place-items:center;align-content:center;line-height:1;font-size:1.2em}
.grid button small{display:block;font-size:.55em;color:#c99a14;letter-spacing:.05em;min-height:1em}
.grid button.lock{opacity:.4;cursor:not-allowed}
.home{color:var(--ink);font-weight:800;font-size:.85em;opacity:.7;text-decoration:none;padding:.4em .6em;border-radius:999px;align-self:center}
.home:hover{opacity:1;text-decoration:underline}
.home:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.nflag{width:2.2em;height:auto}
#rotate{display:none;align-items:center;gap:10px;background:var(--paper);color:var(--ink);font:800 14px/1.3 var(--body);padding:8px 8px 8px 14px;border-radius:999px;max-width:100%;box-sizing:border-box}
#rotate button{font-size:13px;padding:2px 10px;box-shadow:none;background:#ead8bf}
@media (orientation:portrait) and (max-width:820px){#rotate.show{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="rotate" role="note"><span>Turn your phone sideways for a bigger game</span><button id="bRot" aria-label="Dismiss">OK</button></div>
<div id="stage">
  <canvas id="cv" aria-label="Momo Drop game area"></canvas>
  <div class="hud" id="hud" hidden>
    <button id="bMenu" class="icon" aria-label="Levels">☰</button>
    <div class="lvl" id="lvl">Level 1</div>
    <div class="ink"><span>Ink</span><div class="bar"><i id="inkBar"></i></div></div>
    <button id="bUndo">Undo</button>
    <button id="bClear">Clear</button>
    <button id="bFull" class="icon" aria-label="Full screen">⛶</button>
    <button id="bGo" class="go">Drop!</button>
  </div>
  <div class="tip" id="tip" hidden></div>

  <div class="panel" id="pMenu">
    <div class="card">
      <svg class="nflag" viewBox="0 0 100 122" aria-hidden="true"><path d="M4,4 L94,62 H42 L94,118 H4Z" fill="#dc143c" stroke="#003893" stroke-width="7"/><path d="M15,38 a13,13 0 0 0 26,0 a13,8 0 0 1 -26,0z" fill="#fff"/><circle cx="28" cy="43" r="5" fill="#fff"/><path d="M28,78 l3,8 8,-3 -3,8 8,3 -8,3 3,8 -8,-3 -3,8 -3,-8 -8,3 3,-8 -8,-3 8,-3 -3,-8 8,3z" fill="#fff"/></svg>
      <h1>Momo Drop</h1>
      <p>Draw lines to guide the momo onto the plate. Keep it away from the chilies!</p>
      <div class="row"><button class="go big" id="bPlay">Play</button><button class="big" id="bLevels">Levels</button></div>
      <a class="home" href="../../">← All games</a>
    </div>
  </div>
  <div class="panel" id="pLevels" hidden>
    <div class="card"><h2>Choose a level</h2><div class="grid" id="grid"></div><div class="row"><button id="bBack">Back</button><a class="home" href="../../">All games</a></div></div>
  </div>
  <div class="panel" id="pWin" hidden>
    <div class="card"><h2 id="winTitle">Delicious!</h2><div class="stars" id="winStars"></div><p id="winMsg"></p>
      <div class="row"><button id="bReplay">Replay</button><button class="go big" id="bNext">Next</button></div></div>
  </div>
  <div class="panel" id="pLose" hidden>
    <div class="card"><h2 id="loseTitle">Oops!</h2><p id="loseMsg"></p>
      <div class="row"><button id="bEdit">Fix my lines</button><button class="go" id="bRetry">Start over</button></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
if(!window.Matter){const c=document.querySelector('#pMenu .card');c.querySelector('p').textContent='The game engine could not load. Check your connection and refresh the page.';c.querySelector('.row').innerHTML='<button class="go big" onclick="location.reload()">Retry</button>';return}
const {Engine,Bodies,Body,Composite,Events}=Matter;
const W=1280,H=720,MR=30,LINE_COL=22,SUB=4,DT=1/60,MAXV=26,SPRING=18; // speeds in px per substep-frame
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');

/* ---------- levels ----------
 m: momo start   p: bowl [x,y] (y = bowl floor)   pm: bowl motion [ax,ay,period]
 plat:[x,y,w,h,angle]  chili:[x,y]  spin:[x,y,len,speed]  bounce:[x,y,w,angle]
 move: sliding shelf [x,y,w,ax,ay,period] */
const LV=[
 {m:[260,240],p:[960,640],ink:1000,tip:'Draw a ramp, then press Drop!'},
 {m:[200,240],p:[1060,470],ink:900,plat:[[1060,494,260,26]],tip:'The bowl is up high this time'},
 {m:[640,230],p:[640,650],ink:850,plat:[[640,400,380,34]],tip:'Get around the shelf'},
 {m:[180,240],p:[1100,640],ink:1200,chili:[[380,650],[470,650],[560,650],[650,650],[740,650],[830,650]],tip:'Too spicy! Don’t touch the chilies'},
 {m:[1100,240],p:[190,520],ink:1100,plat:[[190,544,250,26]]},
 {m:[190,230],p:[1080,640],ink:1200,plat:[[640,520,40,400]]},
 {m:[300,230],p:[1000,640],ink:1050,spin:[[640,470,300,1.4]],tip:'Watch the spinning spoon'},
 {m:[220,240],p:[1060,640],ink:1000,move:[[640,440,240,240,0,3.2]],chili:[[480,660],[580,660],[680,660],[780,660]],tip:'Shelves can slide. Time your drop!'},
 {m:[160,300],p:[1140,560],ink:1000,plat:[[1140,584,240,26]],chili:[[420,215],[560,215],[700,215],[840,215],[420,620],[560,620],[700,620],[840,620]]},
 {m:[1150,240],p:[640,650],ink:1100,plat:[[548,590,20,150],[732,590,20,150]],chili:[[640,380],[380,540],[900,540]]},
 {m:[150,230],p:[1060,440],ink:900,plat:[[1060,464,240,26]],bounce:[[520,650,220,.35]],tip:'Yellow pads launch the momo'},
 {m:[640,230],p:[640,640],ink:700,pm:[300,0,4],tip:'The bowl won’t sit still'},
 {m:[200,230],p:[1080,650],ink:1100,spin:[[480,390,260,-1.6],[800,510,260,1.8]],chili:[[640,660],[300,620]]},
 {m:[130,230],p:[1150,640],ink:1300,plat:[[640,520,40,400]],spin:[[960,360,240,2]],chili:[[340,660],[440,660],[840,660],[940,660]],bounce:[[330,560,160]]},
 {m:[1120,230],p:[200,640],ink:1200,move:[[820,420,220,0,110,2.6],[460,520,200,160,0,3]],pm:[90,0,3.4],chili:[[640,660],[740,660],[540,660]],tip:'Final course. Everything moves!'},
];

/* ---------- save ---------- */
const KEY='momodrop-stars-v2';
let stars=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(s))stars=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(stars))}catch(e){}};

/* ---------- audio ---------- */
let ac=null,t=0,lastBounce=0,lastThud=0;
function tone(f,d=.12,type='sine',v=.15,slide=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
// Creating the AudioContext costs ~140ms the first time. Do it on the player's first tap/key (normally on the
// menu, where a pause is invisible) rather than inside the first sound, which used to land mid-drop and stutter the physics.
function audioInit(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
addEventListener('pointerdown',audioInit,{once:true,capture:true});addEventListener('keydown',audioInit,{once:true,capture:true});
const sfx={drop:()=>tone(520,.25,'triangle',.15,-300),pop:()=>tone(900,.06,'sine',.08),
 thud:v=>{if(t-lastThud>.08){lastThud=t;tone(140+v*6,.08,'sine',Math.min(.18,.03+v*.012))}},
 bounce:()=>{if(t-lastBounce>.15){lastBounce=t;tone(300,.15,'sine',.2,250)}},
 splash:()=>{tone(380,.18,'sine',.16,-220);setTimeout(()=>tone(620,.12,'triangle',.08,-200),70)},
 win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.15),250+i*110)),lose:()=>tone(200,.4,'sawtooth',.08,-120)};

/* ---------- state ---------- */
let resume=null,L=0,lv=null,engine=null,momo=null,phase='menu',strokes=[],cur=null,inkLeft=0,runT=0,stillT=0,inT=0,
    spins=[],statics=[],movers=[],bowl=null,parts=[],trail=[],gen=0,lastSafe=null,pid=null,springPending=false,
    squash=0,shake=0,sink=null,kt=0;

function load(i){
  resume=null;L=i;lv=LV[i];strokes=[];inkLeft=lv.ink;parts=[];kt=0;
  $('lvl').textContent='Level '+(i+1);
  toDraw();showTip(lv.tip);
}
function toDraw(){gen++;phase='draw';momo=null;cur=null;pid=null;sink=null;trail=[];build();hidePanels();$('hud').hidden=false;$('tip').hidden=true;updUI()}

/* bowl: a real U-shaped pit the momo has to fall into */
function bowlAt(time){const [x,y]=lv.p,m=lv.pm;if(!m)return{x,y};const s=Math.sin(time*2*Math.PI/m[2]);return{x:x+m[0]*s,y:y+m[1]*s}}
function moverAt(mv,time){const s=Math.sin(time*2*Math.PI/mv[5]);return{x:mv[0]+mv[3]*s,y:mv[1]+mv[4]*s}}
function build(){
  engine=Engine.create({positionIterations:10,velocityIterations:8});engine.gravity.y=1.1;
  statics=[];spins=[];movers=[];
  const add=b=>{Composite.add(engine.world,b);return b};
  for(const p of lv.plat||[])statics.push(add(Bodies.rectangle(p[0],p[1],p[2],p[3],{isStatic:true,angle:p[4]||0,friction:.05,label:'plat'})));
  for(const b of lv.bounce||[]){const a=b[3]||0,pad=add(Bodies.rectangle(b[0],b[1],b[2],22,{isStatic:true,angle:a,restitution:.2,label:'bounce'}));pad.launch={x:Math.sin(a),y:-Math.cos(a)};statics.push(pad)}
  for(const s of lv.spin||[]){const b=add(Bodies.rectangle(s[0],s[1],s[2],22,{isStatic:true,label:'spin',friction:.05}));b.spd=s[3];spins.push(b)}
  for(const mv of lv.move||[]){const q=moverAt(mv,kt),b=add(Bodies.rectangle(q.x,q.y,mv[2],24,{isStatic:true,friction:.5,label:'move'}));b.mv=mv;movers.push(b)}
  for(const c of lv.chili||[])add(Bodies.circle(c[0],c[1],22,{isStatic:true,isSensor:true,label:'chili'}));
  const q=bowlAt(kt);bowl={x:q.x,y:q.y,parts:[]};
  const part=(ox,oy,w,h,a,label)=>{const b=add(Bodies.rectangle(q.x+ox,q.y+oy,w,h,{isStatic:true,angle:a,friction:.6,restitution:0,label}));bowl.parts.push({b,ox,oy})};
  part(0,0,150,14,0,'bowl');
  const wa=Math.atan2(54,-34); // wall from rim (±105,-52) down to base (±71,+2)
  part(-88,-25,66,14,-wa,'bowl');part(88,-25,66,14,wa,'bowl');
  for(const s of strokes)addStroke(s);
  Events.on(engine,'collisionStart',e=>{
    if(phase!=='run'||!momo)return;
    for(const pr of e.pairs){const o=pr.bodyA===momo?pr.bodyB:pr.bodyB===momo?pr.bodyA:null;if(!o)continue;
      if(o.label==='chili'){burst(momo.position.x,momo.position.y,18,['#d8322b','#ff8a3d','#2e9d55'],7);lose('Too spicy!','The momo touched a chili. Try a different path.');}
      else if(o.label==='bounce'){sfx.bounce();springPending=o;squash=.35;shake=Math.max(shake,4)}
      else{const v=momo.speed;if(v>3){squash=Math.min(.3,v/45);sfx.thud(v);if(v>6)burst(momo.position.x,momo.position.y+MR*.6,5,['#f3e3cb','#e8d2b0'],2.5)}}}
  });
}
function kinematics(time,withVel){
  for(const b of movers)Body.setPosition(b,moverAt(b.mv,time),withVel);
  if(lv.pm){const q=bowlAt(time);bowl.x=q.x;bowl.y=q.y;for(const p of bowl.parts)Body.setPosition(p.b,{x:q.x+p.ox,y:q.y+p.oy},withVel)}
}
function inBowl(){const p=momo.position;return Math.abs(p.x-bowl.x)<78&&p.y>bowl.y-62&&p.y<bowl.y+8}
function simplify(pts,eps){ // Ramer-Douglas-Peucker: fewer joints = smoother rolling
  if(pts.length<3)return pts;const [a,b]=[pts[0],pts[pts.length-1]];let md=0,mi=0;const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;
  for(let i=1;i<pts.length-1;i++){const d=Math.abs(dy*pts[i][0]-dx*pts[i][1]+b[0]*a[1]-b[1]*a[0])/L;if(d>md){md=d;mi=i}}
  if(md<=eps)return[a,b];return simplify(pts.slice(0,mi+1),eps).slice(0,-1).concat(simplify(pts.slice(mi),eps));
}
function addStroke(raw){
  const s=simplify(raw,2);
  for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<1)continue;
    Composite.add(engine.world,Bodies.rectangle((a[0]+b[0])/2,(a[1]+b[1])/2,len+LINE_COL,LINE_COL,{isStatic:true,angle:Math.atan2(dy,dx),friction:.04,restitution:.1,chamfer:{radius:LINE_COL/2-1},label:'line'}))}
}
function drop(){
  if(phase!=='draw')return;
  if(cur)finish();build();
  momo=Bodies.circle(lv.m[0],lv.m[1],MR,{restitution:.25,friction:.03,frictionAir:.002,density:.002,label:'momo'});
  Composite.add(engine.world,momo);lastSafe={x:momo.position.x,y:momo.position.y};
  phase='run';runT=0;stillT=0;inT=0;springPending=false;sfx.drop();$('tip').hidden=true;updUI();
}
function burst(x,y,n,cols,pow,grav=.35){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*pow*2,vy:-Math.random()*pow-1,c:cols[i%cols.length],r:Math.random()*6.283,l:1,s:4+Math.random()*4,g:grav,round:true})}
function win(){
  if(phase!=='run')return;phase='won';sfx.splash();sfx.win();updUI();
  // hand the momo over to the sink animation: it slides into the bowl and settles in the jhol
  sink={t:0,x:momo.position.x,y:momo.position.y,a:momo.angle};Composite.remove(engine.world,momo);
  burst(bowl.x,bowl.y-48,22,['#f08a2c','#ffb347','#d8322b'],6);
  const g=gen,used=1-inkLeft/lv.ink,s=used<.6?3:used<.85?2:1;
  stars[L]=Math.max(stars[L]||0,s);save();
  setTimeout(()=>{if(g!==gen||phase!=='won')return;
    for(let i=0;i<46;i++)parts.push({x:bowl.x,y:bowl.y-40,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,c:i%3?'#dc143c':i%2?'#003893':'#ffffff',r:Math.random()*6.283,l:1,s:0,g:.35});
  },450);
  setTimeout(()=>{if(g!==gen||phase!=='won')return;
    $('winStars').innerHTML=[1,2,3].map(k=>k<=s?'<b>★</b>':'★').join('');
    $('winTitle').textContent=L===LV.length-1?'You beat every level!':'Delicious!';
    $('winMsg').textContent=s===3?'Perfect! Hardly any ink used.':s===2?'Nice! Use less ink for 3 stars.':'Served! Use less ink to earn more stars.';
    $('bNext').textContent=L<LV.length-1?'Next':'Levels';
    show('pWin');
  },1300);
}
function lose(title,msg){if(phase!=='run')return;phase='lost';sfx.lose();shake=10;updUI();const g=gen;setTimeout(()=>{if(g!==gen||phase!=='lost')return;$('loseTitle').textContent=title;$('loseMsg').textContent=msg;show('pLose')},550)}

/* ---------- input ---------- */
function pt(e){const r=cv.getBoundingClientRect();return[Math.max(0,Math.min(W,(e.clientX-r.left)/r.width*W)),Math.max(0,Math.min(H,(e.clientY-r.top)/r.height*H))]}
const nearMomo=p=>Math.hypot(p[0]-lv.m[0],p[1]-lv.m[1])<MR+LINE_COL;
// does the segment a->b pass through the momo's start spot? (fast swipes skip past nearMomo point checks)
const segHitsMomo=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1,u=Math.max(0,Math.min(1,((lv.m[0]-a[0])*dx+(lv.m[1]-a[1])*dy)/l2));return Math.hypot(a[0]+dx*u-lv.m[0],a[1]+dy*u-lv.m[1])<MR+LINE_COL};
cv.addEventListener('pointerdown',e=>{
  if(phase!=='draw'||inkLeft<=2||pid!==null)return;
  const p=pt(e);if(nearMomo(p))return;
  pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}
  cur=[p];$('tip').hidden=true;e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!cur||e.pointerId!==pid)return;
  const list=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of list.length?list:[e]){
    if(!cur)break;
    const p=pt(ev),a=cur[cur.length-1];
    if(nearMomo(p)||segHitsMomo(a,p)){finish();break}
    let d=Math.hypot(p[0]-a[0],p[1]-a[1]);if(d<8)continue;
    if(d>inkLeft){const k=inkLeft/d;p[0]=a[0]+(p[0]-a[0])*k;p[1]=a[1]+(p[1]-a[1])*k;d=inkLeft}
    cur.push(p);inkLeft=Math.max(0,inkLeft-d);
    if(inkLeft<=.5){finish();break}
  }
  if(Math.random()<.2)tone(700+Math.random()*200,.03,'sine',.03);
  updUI();
});
// a tap (no drag) leaves a 1-point stroke: refund nothing, keep nothing
function finish(){if(cur&&cur.length>1){strokes.push(cur);sfx.pop()}cur=null;pid=null;updUI()}
const endPtr=e=>{if(e.pointerId===pid)finish()};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('lostpointercapture',endPtr);
const strokeLen=s=>s.reduce((a,p,i)=>i?a+Math.hypot(p[0]-s[i-1][0],p[1]-s[i-1][1]):0,0);

function undo(){if(phase!=='draw'||!strokes.length)return;inkLeft=Math.min(lv.ink,inkLeft+strokeLen(strokes.pop()));updUI()}
$('bGo').onclick=()=>{if(phase==='draw')drop();else if(phase==='run')toDraw()};
$('bUndo').onclick=undo;
$('bClear').onclick=()=>{if(phase!=='draw')return;strokes=[];cur=null;inkLeft=lv.ink;updUI()};
$('bPlay').onclick=()=>{const n=LV.findIndex((_,i)=>!stars[i]);load(n<0?0:n)};
$('bLevels').onclick=()=>openLevels();$('bMenu').onclick=()=>openLevels(true);
$('bBack').onclick=back;
function back(){
  if(resume){const r=resume;resume=null;L=r.L;lv=LV[L];strokes=r.strokes;inkLeft=r.ink;$('lvl').textContent='Level '+(L+1);toDraw();return} // came from a level: go back into it, lines kept
  gen++;phase='menu';lv=null;momo=null;show('pMenu');$('hud').hidden=true;$('tip').hidden=true;
}
$('bNext').onclick=()=>L<LV.length-1?load(L+1):openLevels();
$('bReplay').onclick=()=>load(L);
$('bRetry').onclick=()=>load(L);
$('bEdit').onclick=toDraw;
$('bFull').onclick=()=>{const st=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else{const r=st.requestFullscreen&&st.requestFullscreen();r&&r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})}}catch(_){}};
if(!document.fullscreenEnabled)$('bFull').hidden=true;
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter')&&!$('hud').hidden&&(phase==='draw'||phase==='run')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();$('bGo').click()}
  else if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();undo()}
  else if(e.key==='Escape'&&window.parent!==window){try{window.parent.postMessage({type:'momo-drop-close'},location.origin)}catch(_){}} // embedded: let the host close it
  else if(e.key==='Escape'&&!$('pLevels').hidden){back()}
  else if(e.key==='Escape'&&!$('hud').hidden&&(phase==='draw'||phase==='run')){openLevels(true)}
});

function openLevels(fromLevel){
  if(cur)finish();
  resume=fromLevel&&lv?{L,strokes:strokes.slice(),ink:inkLeft}:null;
  gen++;phase='menu';lv=null;momo=null;$('hud').hidden=true;$('tip').hidden=true;
  $('grid').innerHTML=LV.map((_,i)=>{const open=i===0||stars[i-1]||stars[i];return `<button data-i="${i}" class="${open?'':'lock'}" aria-label="Level ${i+1}${open?'':' (locked)'}">${open?i+1:'🔒'}<small>${'★'.repeat(stars[i]||0)}</small></button>`}).join('');
  $('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!b.classList.contains('lock'))load(+b.dataset.i)});
  show('pLevels');
}
function show(id){hidePanels();$(id).hidden=false}
function hidePanels(){['pMenu','pLevels','pWin','pLose'].forEach(i=>$(i).hidden=true)}
function showTip(s){$('tip').hidden=!s;$('tip').textContent=s||''}
function updUI(){
  const f=lv?inkLeft/lv.ink:1,b=$('inkBar');b.style.width=(100*f)+'%';b.classList.toggle('low',f<.15);
  const g=$('bGo');g.textContent=phase==='draw'?'Drop!':'Reset';g.classList.toggle('reset',phase!=='draw');
  g.disabled=!(phase==='draw'||phase==='run');
  $('bUndo').disabled=phase!=='draw'||!strokes.length;$('bClear').disabled=phase!=='draw'||!strokes.length;
}
try{if(localStorage.getItem('momodrop-rot')!=='1')$('rotate').classList.add('show')}catch(_){$('rotate').classList.add('show')}
$('bRot').onclick=()=>{$('rotate').classList.remove('show');try{localStorage.setItem('momodrop-rot','1')}catch(_){}};

/* ---------- drawing ---------- */
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*d*9/16)}
new ResizeObserver(resize).observe(cv);

function nepalFlag(x,y,s,sw){
  const h=s*1.22;
  ctx.save();ctx.translate(x,y);ctx.transform(1,sw*.02,0,1,0,0);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s,h*.52);ctx.lineTo(s*.42,h*.52);ctx.lineTo(s,h);ctx.lineTo(0,h);ctx.closePath();
  ctx.fillStyle='#dc143c';ctx.fill();ctx.lineWidth=s*.08;ctx.strokeStyle='#003893';ctx.lineJoin='miter';ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(s*.24,h*.30,s*.12,0,Math.PI);ctx.arc(s*.24,h*.27,s*.12,Math.PI,0,true);ctx.fill();
  ctx.beginPath();ctx.arc(s*.24,h*.33,s*.06,0,7);ctx.fill();
  ctx.beginPath();for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?s*.1:s*.15;ctx.lineTo(s*.25+Math.cos(a)*r,h*.78+Math.sin(a)*r)}ctx.fill();
  ctx.restore();
}
let skyCache=null;
function bg(){
  if(!skyCache){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe7c2');g.addColorStop(1,'#ffb98a');skyCache=g}
  ctx.fillStyle=skyCache;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(1040,190,70,0,7);ctx.fill();
  // drifting clouds
  ctx.fillStyle='rgba(255,250,240,.7)';for(let i=0;i<3;i++){const x=((t*(12+i*6)+i*520)%1600)-160,y=230+i*50;ctx.beginPath();ctx.ellipse(x,y,70,18,0,0,7);ctx.ellipse(x+40,y-10,44,16,0,0,7);ctx.fill()}
  ctx.fillStyle='#e9a07a';ctx.beginPath();ctx.moveTo(0,560);[[120,420],[230,480],[380,330],[520,470],[640,390],[760,500],[900,300],[1040,450],[1160,380],[1280,470],[1280,720],[0,720]].forEach(p=>ctx.lineTo(...p));ctx.fill();
  ctx.fillStyle='#fff6ea';ctx.beginPath();ctx.moveTo(342,368);ctx.lineTo(380,330);ctx.lineTo(420,372);ctx.lineTo(398,362);ctx.lineTo(380,378);ctx.lineTo(362,360);ctx.fill();
  ctx.beginPath();ctx.moveTo(858,342);ctx.lineTo(900,300);ctx.lineTo(944,346);ctx.lineTo(920,336);ctx.lineTo(900,354);ctx.lineTo(880,334);ctx.fill();
  ctx.fillStyle='#d98c69';ctx.beginPath();ctx.moveTo(0,640);[[200,560],[420,620],[640,570],[880,630],[1100,580],[1280,620],[1280,720],[0,720]].forEach(p=>ctx.lineTo(...p));ctx.fill();
  ctx.strokeStyle='#7a5a44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,80);ctx.quadraticCurveTo(640,140,1290,80);ctx.stroke();
  for(let i=0;i<22;i++){const x=16+i*58,u=(x+10)/1300,y=(1-u)*(1-u)*80+2*u*(1-u)*140+u*u*80;nepalFlag(x,y,26,Math.sin(t*2.2+i*.7)*3)}
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function plank(b,col1,col2){
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  const v=b.vertices,w=Math.hypot(v[1].x-v[0].x,v[1].y-v[0].y),h=Math.hypot(v[2].x-v[1].x,v[2].y-v[1].y);
  ctx.fillStyle='rgba(58,36,24,.18)';rr(-w/2+3,-h/2+5,w,h,8);ctx.fill();
  ctx.fillStyle=col1;rr(-w/2,-h/2,w,h,8);ctx.fill();
  ctx.strokeStyle=col2;ctx.lineWidth=2;ctx.beginPath();
  if(w>=h)for(let k=-w/2+18;k<w/2-10;k+=34){ctx.moveTo(k,-h/2+5);ctx.lineTo(k+10,-h/2+5)}
  else for(let k=-h/2+18;k<h/2-10;k+=34){ctx.moveTo(-w/2+5,k);ctx.lineTo(-w/2+5,k+10)}
  ctx.stroke();ctx.restore();
}
function chili(x,y){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*3+x)*.08);
  ctx.fillStyle='#d8322b';ctx.beginPath();ctx.moveTo(-20,-8);ctx.quadraticCurveTo(0,-16,18,-6);ctx.quadraticCurveTo(26,10,4,24);ctx.quadraticCurveTo(10,6,-20,6);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-4,-6,9,3,-.15,0,7);ctx.fill();
  ctx.strokeStyle='#2e9d55';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,0);ctx.quadraticCurveTo(-30,-4,-30,-14);ctx.stroke();ctx.restore();
}
/* bowl is drawn in two halves so the momo can sit *inside* it */
function bowlBack(x,y){
  ctx.fillStyle='rgba(58,36,24,.22)';ctx.beginPath();ctx.ellipse(x+5,y+14,96,14,0,0,7);ctx.fill();
  ctx.fillStyle='#00276b';ctx.beginPath();ctx.ellipse(x,y-52,106,17,0,0,7);ctx.fill();          // inner back wall
  ctx.fillStyle='#e5762a';ctx.beginPath();ctx.ellipse(x,y-38,90,13,0,0,7);ctx.fill();           // jhol (soup)
  ctx.fillStyle='rgba(255,210,140,.55)';ctx.beginPath();ctx.ellipse(x-30,y-41,26,4,0,0,7);ctx.fill();
  // steam
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=4;ctx.lineCap='round';
  for(let i=0;i<3;i++){const ph=(t*.6+i/3)%1,sx=x-40+i*40;ctx.globalAlpha=Math.sin(ph*Math.PI)*.8;ctx.beginPath();ctx.moveTo(sx,y-60-ph*60);ctx.quadraticCurveTo(sx+12*Math.sin(t*3+i),y-75-ph*60,sx,y-90-ph*60);ctx.stroke()}
  ctx.globalAlpha=1;
}
function bowlFront(x,y){
  ctx.beginPath();ctx.moveTo(x-106,y-52);ctx.ellipse(x,y-52,106,17,0,Math.PI,0,true);
  ctx.quadraticCurveTo(x+100,y+2,x+62,y+8);ctx.lineTo(x-62,y+8);ctx.quadraticCurveTo(x-100,y+2,x-106,y-52);ctx.closePath();
  ctx.fillStyle='#003893';ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='#dc143c';ctx.fillRect(x-120,y-24,240,10);ctx.fillStyle='#fff';
  for(let k=-80;k<=80;k+=32){ctx.beginPath();ctx.arc(x+k,y-19,3,0,7);ctx.fill()}ctx.restore();
  ctx.strokeStyle='#f7fbff';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,y-52,106,17,0,0,Math.PI);ctx.stroke();
  if(phase==='draw'){const b=Math.sin(t*4)*6;ctx.strokeStyle='rgba(0,56,147,.5)';ctx.setLineDash([8,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-160+b);ctx.lineTo(x,y-100+b);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,56,147,.6)';ctx.beginPath();ctx.moveTo(x-10,y-106+b);ctx.lineTo(x+10,y-106+b);ctx.lineTo(x,y-92+b);ctx.fill()}
}
function drawMomo(x,y,a,sq=0,sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc*(1+sq),sc*(1-sq));
  ctx.fillStyle='rgba(58,36,24,.18)';ctx.beginPath();ctx.ellipse(3,8,MR+2,MR-4,0,0,7);ctx.fill();
  ctx.rotate(a);
  ctx.fillStyle='#fffaf0';ctx.strokeStyle='#d9bf9c';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-MR,8);ctx.quadraticCurveTo(-MR-2,-MR+8,0,-MR-4);ctx.quadraticCurveTo(MR+2,-MR+8,MR,8);ctx.quadraticCurveTo(MR,MR,0,MR);ctx.quadraticCurveTo(-MR,MR,-MR,8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();for(const k of[-16,-8,0,8,16]){ctx.moveTo(0,-MR-2);ctx.quadraticCurveTo(k*.6,-MR+6,k,-6)}ctx.stroke();
  ctx.fillStyle='#3a2418';ctx.strokeStyle='#3a2418';ctx.lineWidth=3;ctx.lineCap='round';
  const fast=momo&&phase==='run'&&momo.speed>9;
  if(phase==='won'){ctx.beginPath();ctx.arc(-10,8,5,Math.PI,0);ctx.moveTo(15,8);ctx.arc(10,8,5,Math.PI,0);ctx.stroke()}
  else if(phase==='lost'){ctx.beginPath();ctx.moveTo(-14,2);ctx.lineTo(-6,10);ctx.moveTo(-6,2);ctx.lineTo(-14,10);ctx.moveTo(6,2);ctx.lineTo(14,10);ctx.moveTo(14,2);ctx.lineTo(6,10);ctx.stroke()}
  else if(fast){ctx.beginPath();ctx.arc(-10,6,5.5,0,7);ctx.arc(10,6,5.5,0,7);ctx.fill()}
  else{ctx.beginPath();ctx.arc(-10,6,4,0,7);ctx.arc(10,6,4,0,7);ctx.fill()}
  ctx.beginPath();if(phase==='lost')ctx.arc(0,20,5,1.1*Math.PI,1.9*Math.PI);else if(fast){ctx.ellipse(0,17,4,5,0,0,7);ctx.fill()}else ctx.arc(0,13,5,.1*Math.PI,.9*Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(240,120,110,.45)';ctx.beginPath();ctx.ellipse(-19,15,6,3.5,0,0,7);ctx.ellipse(19,15,6,3.5,0,0,7);ctx.fill();
  ctx.restore();
}
function edgeArrow(x,y){
  const cx=Math.max(30,Math.min(W-30,x)),cy=Math.max(30,Math.min(H-30,y));if(cx===x&&cy===y)return;
  const a=Math.atan2(y-cy,x-cx);ctx.save();ctx.translate(cx,cy);ctx.rotate(a);ctx.fillStyle='#dc143c';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-14);ctx.lineTo(-10,14);ctx.fill();ctx.restore();
}
function inkLine(s){
  if(s.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';
  const path=(dx,dy)=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0]+dx,p[1]+dy):ctx.moveTo(p[0]+dx,p[1]+dy));ctx.stroke()};
  ctx.strokeStyle='rgba(58,36,24,.18)';ctx.lineWidth=LINE_COL;path(3,5);
  ctx.strokeStyle='#3a2418';ctx.lineWidth=LINE_COL-2;path(0,0);
  ctx.strokeStyle='rgba(255,240,220,.35)';ctx.lineWidth=3;path(0,-5);
}
function render(){
  const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);
  if(shake>.2){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
  bg();
  if(!lv){drawMomo(640+Math.sin(t*1.5)*220,600-Math.abs(Math.sin(t*3))*60,t*2);return}
  for(const b of statics)plank(b,b.label==='bounce'?'#f2c230':'#a5683b',b.label==='bounce'?'#c99a14':'#7f4d29');
  for(const b of movers){plank(b,'#7fae5a','#55803a');const m=b.mv;ctx.strokeStyle='rgba(58,36,24,.25)';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m[0]-m[3],m[1]-m[4]);ctx.lineTo(m[0]+m[3],m[1]+m[4]);ctx.stroke();ctx.setLineDash([])}
  for(const b of spins){plank(b,'#c88a52','#8f5a31');ctx.fillStyle='#5b3b26';ctx.beginPath();ctx.arc(b.position.x,b.position.y,9,0,7);ctx.fill()}
  for(const c of lv.chili||[])chili(c[0],c[1]);
  for(const s of strokes)inkLine(s);if(cur)inkLine(cur);
  bowlBack(bowl.x,bowl.y);
  for(const p of trail){ctx.globalAlpha=p.l*.35;ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(p.x,p.y,MR*p.l,0,7);ctx.fill()}ctx.globalAlpha=1;
  if(sink){const e=Math.min(1,sink.t/.55),ease=1-Math.pow(1-e,3),tx=bowl.x,ty=bowl.y-26;
    drawMomo(sink.x+(tx-sink.x)*ease,sink.y+(ty-sink.y)*ease+Math.sin(e*Math.PI)*-18,sink.a*(1-ease),-.12*Math.sin(e*Math.PI),1-.18*ease)}
  else if(momo){drawMomo(momo.position.x,momo.position.y,momo.angle,squash)}
  else drawMomo(lv.m[0],lv.m[1]+Math.sin(t*3)*3,0);
  bowlFront(bowl.x,bowl.y);
  if(momo&&!sink)edgeArrow(momo.position.x,momo.position.y);
  for(const p of parts){ctx.save();ctx.globalAlpha=Math.max(0,p.l);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;if(p.round){ctx.beginPath();ctx.arc(0,0,p.s*p.l+1,0,7);ctx.fill()}else ctx.fillRect(-7,-5,14,10);ctx.restore()}
}

/* ---------- loop: fixed timestep with substeps so the momo can't pass through lines ---------- */
function step(){
  t+=DT;squash*=.82;shake*=.85;
  if(sink)sink.t+=DT;
  if(engine&&phase==='run'){
    for(let i=0;i<SUB;i++){
      kt+=DT/SUB;kinematics(kt,true);
      for(const b of spins)Body.setAngle(b,b.angle+b.spd*DT/SUB,true);
      Engine.update(engine,1000*DT/SUB);
      if(springPending&&momo){const l=springPending.launch;springPending=false;Body.setVelocity(momo,{x:l.x*SPRING,y:l.y*SPRING})}
      if(momo){const v=momo.velocity,sp=Math.hypot(v.x,v.y);if(sp>MAXV)Body.setVelocity(momo,{x:v.x/sp*MAXV,y:v.y/sp*MAXV})}
      if(phase!=='run')break;
    }
    if(phase==='run'&&momo){runT+=DT;
      const p=momo.position;
      if(!isFinite(p.x)||!isFinite(p.y)){Body.setPosition(momo,lastSafe);Body.setVelocity(momo,{x:0,y:0})}else lastSafe={x:p.x,y:p.y};
      if(momo.speed>7&&Math.random()<.6)trail.push({x:p.x,y:p.y,l:.8});
      if(p.y>H+90||p.x<-90||p.x>W+90)lose('The momo fell!','It left the screen. Adjust your lines and drop again.');
      else{
        const sp=momo.speed;
        if(inBowl()){inT+=DT;if(inT>.12||sp<2)win()}else inT=0;
        if(sp<.15)stillT+=DT;else stillT=0;
        if(phase==='run'&&stillT>1.8)lose('Momo got stuck','It stopped before reaching the bowl. Try a steeper path.');
        else if(phase==='run'&&runT>16)lose('Too slow!','The momo took too long. Try a more direct path.');
      }
    }
  } else if(lv&&engine){
    kt+=DT;kinematics(kt,false);
    for(const b of spins)Body.setAngle(b,b.angle+b.spd*DT);
  }
  for(const p of trail)p.l-=.06;if(trail.length)trail=trail.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.2;p.l-=.015}
  if(parts.length)parts=parts.filter(p=>p.l>0);
}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(.1,Math.max(0,(now-last)/1000));last=now;while(acc>=DT){step();acc-=DT}render();requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0});
resize();requestAnimationFrame(loop);

/* test hook: only with #test in the URL */
if(location.hash==='#test')window.MD={LV,load,drop,step,get phase(){return phase},set strokes(v){strokes=v},get bowl(){return bowl},get momo(){return momo}};
})();
</script>
